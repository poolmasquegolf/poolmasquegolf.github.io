<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DEMO · RSHECC Pool Damas · Más que golf</title>
<meta name="theme-color" content="#12241C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12241C;
  --ink-soft:#1E3A2C;
  --paper:#F3F2EC;
  --card:#FFFFFF;
  --line:#D8D6CA;
  --line-soft:#E8E6DC;
  --rojo:#BE3A2B;
  --rojo-soft:#F6E4E1;
  --rosa:#EF9BB2;
  --sage:#6F8A72;
  --muted:#6E6E62;
  --gold:#9C7B22;
  --radius:14px;
  --shadow:0 1px 2px rgba(18,36,28,.06), 0 8px 24px -12px rgba(18,36,28,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;
  font-size:16px;line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom);
}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;margin:0;line-height:1.1;letter-spacing:-.02em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
a{color:var(--ink)}
button{font-family:inherit;font-size:inherit}
:focus-visible{outline:2.5px solid var(--rojo);outline-offset:2px;border-radius:6px}

/* ---------- estructura ---------- */
.wrap{max-width:760px;margin:0 auto;padding:0 16px 72px}
header.top{background:var(--ink);color:#EFEFE7;padding:20px 0 0}
header.top .wrap{padding-bottom:0}
.brandrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:'Bricolage Grotesque';font-weight:800;font-size:22px;letter-spacing:-.03em;line-height:1.12;color:#fff}
.brand span{color:var(--rosa)}
.tagline{font-size:12px;color:#93A79A;letter-spacing:.14em;margin-top:6px;font-weight:600}
.whoami{font-size:13px;color:#A9B8AE;background:none;border:0;padding:6px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:14px;scrollbar-width:none;-ms-overflow-style:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{
  flex:0 0 auto;background:none;border:0;color:#9FB2A6;padding:10px 14px 12px;
  font-weight:600;font-size:14px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;
}
nav.tabs button[aria-current="true"]{color:#fff;border-bottom-color:var(--rojo)}

main{padding-top:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stack{display:flex;flex-direction:column;gap:10px}
hr.rule{border:0;border-top:1px solid var(--line-soft);margin:16px 0}

/* ---------- controles ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--ink);color:#fff;border:1px solid var(--ink);
  padding:12px 18px;border-radius:10px;font-weight:600;cursor:pointer;min-height:46px;
}
.btn:hover{background:var(--ink-soft)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:#EDECE4}
.btn.danger{background:var(--rojo);border-color:var(--rojo)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{padding:8px 12px;min-height:38px;font-size:14px}
input,select,textarea{
  font-family:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:#fff;color:var(--ink);width:100%;min-height:46px;
}
label.field{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* ---------- chips ---------- */
.chip{display:inline-block;font-size:12px;font-weight:600;padding:4px 10px;border-radius:100px;border:1px solid var(--line)}
.chip.norte{background:#E7EFE8;border-color:#C4D6C7;color:#2C5136}
.chip.sur{background:#F3EBDD;border-color:#DFCDAF;color:#6B4E17}
.chip.rojo{background:var(--rojo-soft);border-color:#EBC3BD;color:var(--rojo)}
.chip.ok{background:#E7EFE8;border-color:#C4D6C7;color:#2C5136}

/* ---------- firma: número rodeado a boli ---------- */
.circled{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:44px;height:38px;padding:0 8px;
  font-family:'IBM Plex Mono';font-weight:600;font-size:17px;
  border:2px solid var(--rojo);color:var(--rojo);
  border-radius:47% 53% 51% 49% / 53% 47% 53% 47%;
  transform:rotate(-1.5deg);
}
.circled.pale{border-color:#D9C9C6;color:#A88F8B}
.circled.big{min-width:56px;height:48px;font-size:21px}

/* ---------- tablas tipo tarjeta de golf ---------- */
.sheet{width:100%;border-collapse:collapse;font-size:14px}
.sheet th{
  font-family:'Instrument Sans';font-size:11px;letter-spacing:.08em;text-transform:uppercase;
  color:#CFD9D2;background:var(--ink);padding:9px 8px;text-align:left;font-weight:600;
}
.sheet th.num,.sheet td.num{text-align:right}
.sheet td{padding:10px 8px;border-bottom:1px solid var(--line-soft)}
.sheet tr:last-child td{border-bottom:0}
.sheet tbody tr.yo{background:#FBF3F1}
.sheet .name{font-weight:500}
.scroller{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -18px;padding:0 18px}
.pos{font-family:'IBM Plex Mono';color:var(--muted);width:26px}
.pos.p1{color:var(--gold);font-weight:600}

.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.empty strong{display:block;font-family:'Bricolage Grotesque';font-size:18px;color:var(--ink);margin-bottom:4px}

/* ---------- jornada destacada ---------- */
.hero{background:var(--ink);color:#EFEFE7;border:0}
.hero .eyebrow{color:#8FA697}
.hero .fecha{font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;letter-spacing:-.03em;text-transform:capitalize}
.hero .muted{color:#A9B8AE}
.hero .chip{border-color:rgba(255,255,255,.28);color:#EFEFE7;background:rgba(255,255,255,.08)}

.pill-list{display:flex;flex-wrap:wrap;gap:8px}
.pill-list .p{background:#EDECE4;border:1px solid var(--line);border-radius:100px;padding:6px 12px;font-size:14px}
.pill-list .p.yo{background:var(--rojo-soft);border-color:#EBC3BD;color:var(--rojo);font-weight:600}

.uploader{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.thumb{width:52px;height:52px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
input[type=file]{display:none}

.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:22px;z-index:99;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:100px;font-size:14px;
  box-shadow:0 10px 30px -10px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s, bottom .2s;
}
.toast.show{opacity:1;bottom:32px}
.toast.err{background:var(--rojo)}

details.acc{border:1px solid var(--line);border-radius:12px;background:#fff;margin-bottom:8px;overflow:hidden}
details.acc>summary{cursor:pointer;padding:14px 16px;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:10px}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>div{padding:0 16px 16px}

footer{text-align:center;padding:28px 16px 40px;color:var(--muted);font-size:12px}
footer button{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-size:12px}
footer .firma{margin-top:18px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:11px;letter-spacing:.06em;color:#9A9A8E}

select.destacado{background:#FBF3DF;border-color:#E3D3A8;font-weight:600;color:#4A3A12}
.seg{display:flex;gap:4px;background:#E7E5DB;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:14px}
.seg button{flex:1;background:none;border:0;padding:10px 8px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;min-height:42px}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(18,36,28,.12)}

.demo-banda{background:#BE3A2B;color:#fff;text-align:center;font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;padding:7px 12px}
.warn{background:#FBF1E4;border:1px solid #E6CFA6;color:#6B4E17;padding:12px 14px;border-radius:10px;font-size:14px}
.note{background:#EDF2EE;border:1px solid #C9DACE;padding:12px 14px;border-radius:10px;font-size:14px}

@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}.hero .fecha{font-size:26px}.brand{font-size:19px}}
</style>
</head>

/* Simulador de la base de datos: acepta las mismas llamadas que Supabase. */
const coincide = (fila, filtros) => filtros.every(([c,v]) => String(fila[c]) === String(v));
function consulta(tabla){
  const filtros = [];
  const api = {
    eq(col, val){ filtros.push([col,val]); return api; },
    order(){ return api; },
    select(){ return api; },
    then(res){ res({ data: BD[tabla].filter(f => coincide(f, filtros)), error:null }); }
  };
  return api;
}
const db = {
  from(tabla){
    if (!BD[tabla]) BD[tabla] = [];
    return {
      select: () => consulta(tabla),
      insert(filas){
        [].concat(filas).forEach(f => BD[tabla].push({ ...f }));
        return Promise.resolve({ error:null });
      },
      upsert(filas, opc){
        const claves = (opc && opc.onConflict ? opc.onConflict : 'id').split(',');
        [].concat(filas).forEach(f => {
          const i = BD[tabla].findIndex(x => claves.every(k => String(x[k]) === String(f[k])));
          if (i >= 0) BD[tabla][i] = { ...BD[tabla][i], ...f }; else BD[tabla].push({ ...f });
        });
        return Promise.resolve({ error:null });
      },
      update(cambios){
        const filtros = [];
        const api = { eq(c,v){ filtros.push([c,v]); return api; },
          then(res){ BD[tabla].forEach(f => { if (coincide(f, filtros)) Object.assign(f, cambios); });
                     res({ error:null }); } };
        return api;
      },
      delete(){
        const filtros = [];
        const api = { eq(c,v){ filtros.push([c,v]); return api; },
          then(res){ BD[tabla] = BD[tabla].filter(f => !coincide(f, filtros)); res({ error:null }); } };
        return api;
      }
    };
  },
  rpc(fn, args){
    if (fn === 'es_admin') return Promise.resolve({ data: args.clave === 'demo', error:null });
    if (fn === 'cambiar_clave_admin') return Promise.resolve({ data:false, error:null });
    return Promise.resolve({ data:null, error:null });
  },
  storage: {
    from(){ return {
      upload(){ return Promise.resolve({ error:null }); },
      getPublicUrl(){ return { data:{ publicUrl:'#' } }; }
    }; }
  }
};

const HCP_MAX = 30.0;   // tope acordado por el grupo
const r1 = x => Math.round(x*10)/10;
const catDe = h => CATEGORIAS.find(c => h <= c.max + 1e-9) || CATEGORIAS[4];
const bandaDe = (c,p) => p <= 40 ? c.baja[0] : (p <= 45 ? c.baja[1] : c.baja[2]);

/** Revisa el hándicap exacto a partir de los puntos stableford de una vuelta. */
function revisarHcp(hcpAntes, puntos){
  const c0 = catDe(hcpAntes);
  const zn = c0.zn + '-36';
  if (puntos == null || isNaN(puntos))
    return { despues:hcpAntes, variacion:0, categoria:c0.cat, zn, motivo:'sin tarjeta' };
  if (puntos >= c0.zn && puntos <= 36)
    return { despues:hcpAntes, variacion:0, categoria:c0.cat, zn, motivo:'zona neutra' };
  if (puntos < c0.zn){
    const nuevo = Math.min(HCP_MAX, r1(hcpAntes + c0.sube));
    return { despues:nuevo, variacion:r1(nuevo-hcpAntes), categoria:c0.cat, zn, motivo:'por debajo de la zona neutra' };
  }
  // bajada progresiva punto a punto, recalculando la categoría en cada paso
  let h = hcpAntes;
  for (let p = 37; p <= puntos; p++) h = r1(h - bandaDe(catDe(h), p));
  h = r1(Math.max(-10, h));
  return { despues:h, variacion:r1(h-hcpAntes), categoria:c0.cat, zn, motivo:'por encima de la zona neutra' };
}

/** Hándicap de juego = exacto × (slope/113) + (CR − par), redondeado al entero. */
function hcpJuego(hcpExacto, campo){
  if (!campo) return null;
  return Math.round(hcpExacto * (campo.slope/113) + (Number(campo.cr) - campo.par));
}

const S = {
  config:{}, campos:[], jugadoras:[], jornadas:[], inscripciones:[], tarjetas:[], historial:[],
  yo:null, admin:false, vista:'jornada', jSel:null, jTarj:null, jRes:null
};

const MESES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const fechaLarga = s => { const d = new Date(s+'T12:00:00'); return `${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]}`; };
const fechaCorta = s => { const d = new Date(s+'T12:00:00'); return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`; };
const esc = s => String(s??'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function campoDe(recorrido, barras){
  return S.campos.find(c => c.recorrido === recorrido && c.barras === (barras||'Rojas')) || null;
}
const corto = p => (p && (p.nombre_corto || p.nombre)) || '';
function nombreDe(id){ const j = S.jugadoras.find(x=>x.id===id); return j ? corto(j) : id; }

/** Cierre de inscripción: el viernes anterior a la jornada, a la hora configurada. */
function cierreDe(j){
  if (j.cierre) return new Date(j.cierre);
  const hora = (S.config.cierre_hora || '20:00').split(':');
  const d = new Date(j.fecha + 'T12:00:00');
  d.setDate(d.getDate() - 1);
  while (d.getDay() !== 5) d.setDate(d.getDate() - 1);
  d.setHours(+hora[0], +hora[1], 0, 0);
  return d;
}
const inscripcionAbierta = j => j.estado === 'abierta' && new Date() < cierreDe(j);
const suspendida = j => j.estado === 'suspendida';

function proximaJornada(){
  const hoy = new Date().toISOString().slice(0,10);
  return S.jornadas.find(j => j.fecha >= hoy && !suspendida(j))
      || S.jornadas.filter(j => !suspendida(j)).pop() || null;
}
/** Jornadas suspendidas que quedan por delante de la próxima que se juega. */
function suspendidasProximas(){
  const hoy = new Date().toISOString().slice(0,10);
  const prox = proximaJornada();
  return S.jornadas.filter(j => suspendida(j) && j.fecha >= hoy && (!prox || j.fecha <= prox.fecha));
}
function ultimaConTarjetas(){
  const con = S.jornadas.filter(j => S.tarjetas.some(t => t.jornada === j.id && t.puntos != null));
  return con.length ? con[con.length-1] : null;
}

   Carga
   ============================================================ */
async function cargar(){
  const [cfg, cmp, jug, jor, ins, tar, his] = await Promise.all([
    db.from('config').select('*'),
    db.from('campos').select('*'),
    db.from('jugadoras').select('*').order('orden').order('nombre'),
    db.from('jornadas').select('*').order('fecha'),
    db.from('inscripciones').select('*'),
    db.from('tarjetas').select('*'),
    db.from('handicaps_historial').select('*')
  ]);
  const err = [cfg,cmp,jug,jor,ins,tar,his].find(r=>r.error);
  if (err) throw err.error;
  S.config = Object.fromEntries((cfg.data||[]).map(r=>[r.clave, r.valor]));
  S.campos = cmp.data||[]; S.jugadoras = jug.data||[]; S.jornadas = jor.data||[];
  S.inscripciones = ins.data||[]; S.tarjetas = tar.data||[]; S.historial = his.data||[];
  const guardada = store.get('damas_rshe_yo');
  S.yo = S.jugadoras.find(j => j.id === guardada) || null;
}

}

  ${suspendidasProximas().map(x => `<div class="warn" style="margin-bottom:14px">
      <strong>${esc(x.id)} · ${fechaLarga(x.fecha)}</strong> — suspendida${x.nota?': '+esc(x.nota):' (festivo)'}.

    <div class="fecha">${fechaLarga(j.fecha)}</div>
    <div style="margin:12px 0 4px">${chipRec}</div>
    <div class="muted small" style="margin-top:10px">
      ${abierta ? `Inscripciones abiertas hasta el ${DIAS[cierre.getDay()]} ${cierre.getDate()} a las ${String(cierre.getHours()).padStart(2,'0')}:${String(cierre.getMinutes()).padStart(2,'0')}`

  </div>

  <div class="card">${accion}</div>

  <div class="card">
    <div class="row"><div class="eyebrow" style="margin:0">Apuntadas</div>
      <div class="mono" style="font-size:20px;font-weight:600">${inscritas.length}</div></div>
    <hr class="rule">
    ${inscritas.length ? `<div class="pill-list">${inscritas
        .map(id => `<span class="p ${S.yo&&id===S.yo.id?'yo':''}">${esc(nombreDe(id))}</span>`).join('')}</div>`
      : `<div class="empty"><strong>Nadie todavía</strong>Sé la primera.</div>`}
  </div>

    <div class="eyebrow">Tu hándicap para esta jornada</div>
    ${S.yo ? (() => {
      const h = Number(S.yo.hcp_exacto);
      const cN = campoDe('Norte', j.barras), cS = campoDe('Sur', j.barras);
      const caja = (etq, val, activo) => `<div style="text-align:center;padding:12px 6px;border:1px solid ${activo?'var(--rojo)':'var(--line)'};border-radius:12px;background:${activo?'var(--rojo-soft)':'#fff'}">

          <div class="mono" style="font-size:28px;font-weight:600;${activo?'color:var(--rojo)':''}">${val}</div></div>`;

          ${caja('Juego Sur',  hcpJuego(h, cS) ?? '—', j.recorrido === 'Sur')}

}

async function cambiarInscripcion(alta){
  if (!S.yo || !S.jSel) return;
  const j = S.jornadas.find(x => x.id === S.jSel);
  if (!inscripcionAbierta(j)) return aviso('Las inscripciones ya están cerradas', 'err');
  if (alta){
    const { error } = await db.from('inscripciones').insert({ jornada:j.id, jugadora:S.yo.id });
    if (error) return aviso('No se pudo guardar la inscripción', 'err');
    S.inscripciones.push({ jornada:j.id, jugadora:S.yo.id });
    aviso('Apuntada');
  } else {
    const { error } = await db.from('inscripciones').delete().eq('jornada', j.id).eq('jugadora', S.yo.id);
    if (error) return aviso('No se pudo dar de baja', 'err');
    S.inscripciones = S.inscripciones.filter(i => !(i.jornada===j.id && i.jugadora===S.yo.id));
    aviso('Baja registrada');
  }
  render();
}

/** Fija el recorrido de una jornada y rehace los hándicaps de juego ya anotados. */
async function fijarRecorrido(jid, valor){
  const rec = valor || null;
  const { error } = await db.from('jornadas').update({ recorrido: rec }).eq('id', jid);
  if (error) return aviso('No se pudo guardar el campo', 'err');
  const j = S.jornadas.find(x => x.id === jid); if (j) j.recorrido = rec;
  const campo = campoDe(rec, j ? j.barras : 'Rojas');
  const afectadas = S.tarjetas.filter(t => t.jornada === jid);
  for (const t of afectadas){
    const p = S.jugadoras.find(x => x.id === t.jugadora);
    const hExacto = t.hcp_exacto != null ? Number(t.hcp_exacto) : (p ? Number(p.hcp_exacto) : null);
    const hj = (campo && hExacto != null) ? hcpJuego(hExacto, campo) : null;
    if (hj === t.hcp_juego) continue;
    const { error:e2 } = await db.from('tarjetas').update({ hcp_juego: hj })
      .eq('jornada', jid).eq('jugadora', t.jugadora);
    if (e2) return aviso('No se pudieron recalcular los hándicaps de juego', 'err');
    t.hcp_juego = hj;
  }
  render();
  aviso(rec ? `Campo ${rec} guardado` : 'Campo sin fijar');
}

async function vaciarPuntos(id){
  const campo = document.getElementById('pt_'+id);
  if (campo) campo.value = '';
  await guardarTarjeta(id);
}

async function guardarTarjeta(id){
  const j = S.jornadas.find(x => x.id === S.jTarj);
  const campo = campoDe(j.recorrido, j.barras);
  const p = S.jugadoras.find(x => x.id === id);
  const raw = document.getElementById('pt_'+id).value;
  const puntos = raw === '' ? null : parseInt(raw, 10);
  if (puntos != null && (isNaN(puntos) || puntos < 0 || puntos > 60))
    return aviso('Los puntos deben estar entre 0 y 60', 'err');
  const prev = S.tarjetas.find(t => t.jornada===j.id && t.jugadora===id) || {};
  const fila = {
    jornada:j.id, jugadora:id, puntos,
    foto_url: prev.foto_url ?? null,
    hcp_exacto: prev.hcp_exacto ?? Number(p.hcp_exacto),
    hcp_juego: prev.hcp_juego ?? hcpJuego(Number(p.hcp_exacto), campo),
    subida_por: S.yo ? S.yo.nombre : 'sin identificar',
    actualizado_en: new Date().toISOString()
  };
  const { error } = await db.from('tarjetas').upsert(fila, { onConflict:'jornada,jugadora' });
  if (error) return aviso('No se pudo guardar', 'err');
  S.tarjetas = S.tarjetas.filter(t => !(t.jornada===j.id && t.jugadora===id)).concat(fila);
  aviso('Tarjeta guardada'); render();
}

/** Reduce la foto antes de subirla para que no pese de más. */
function reducir(file){
  return new Promise(res => {
    const img = new Image();
    img.onload = () => {
      const max = 1600, k = Math.min(1, max/Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => res(b || file), 'image/jpeg', 0.82);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => res(file);
    img.src = URL.createObjectURL(file);
  });
}

async function subirFoto(id, input){
  const file = input.files && input.files[0];
  if (!file) return;
  return aviso('En la demostración las fotos no se guardan', 'err');
  const j = S.jornadas.find(x => x.id === S.jTarj);
  const blob = await reducir(file);
  const ruta = `${j.id}/${id}-${Date.now()}.jpg`;
  const { error } = await db.storage.from('tarjetas').upload(ruta, blob, { contentType:'image/jpeg' });
  if (error) return aviso('No se pudo subir la foto', 'err');
  const url = db.storage.from('tarjetas').getPublicUrl(ruta).data.publicUrl;
  const p = S.jugadoras.find(x => x.id === id);
  const campo = campoDe(j.recorrido, j.barras);
  const prev = S.tarjetas.find(t => t.jornada===j.id && t.jugadora===id) || {};
  const fila = {
    jornada:j.id, jugadora:id, puntos: prev.puntos ?? null, foto_url:url,
    hcp_exacto: prev.hcp_exacto ?? Number(p.hcp_exacto),
    hcp_juego: prev.hcp_juego ?? hcpJuego(Number(p.hcp_exacto), campo),
    subida_por: S.yo ? S.yo.nombre : 'sin identificar',
    actualizado_en: new Date().toISOString()
  };
  const { error:e2 } = await db.from('tarjetas').upsert(fila, { onConflict:'jornada,jugadora' });
  if (e2) return aviso('La foto se subió pero no se guardó el enlace', 'err');
  S.tarjetas = S.tarjetas.filter(t => !(t.jornada===j.id && t.jugadora===id)).concat(fila);
  aviso('Foto guardada'); render();
}

/* ---------- 5. Clasificación general ---------- */
function general(){
  const N = parseInt(S.config.mejores_jornadas || '10', 10);
  return S.jugadoras.filter(p => p.activa).map(p => {
    const res = S.jornadas
      .map(j => { const t = S.tarjetas.find(x => x.jornada===j.id && x.jugadora===p.id && x.puntos!=null);
                  return t ? { jornada:j.id, fecha:j.fecha, puntos:t.puntos } : null; })
      .filter(Boolean);
    const orden = [...res].sort((a,b) => b.puntos - a.puntos);
    const cuentan = new Set(orden.slice(0, N).map(r => r.jornada));
    const total = orden.slice(0, N).reduce((s,r) => s + r.puntos, 0);
    return { ...p, res, cuentan, total, jugadas:res.length };
  }).sort((a,b) => b.total - a.total || b.jugadas - a.jugadas || Number(a.hcp_exacto)-Number(b.hcp_exacto));
}

/* ============================================================
   Informes en PDF
   ============================================================ */
function cargarScript(src){
  return new Promise((ok, ko) => {
    const s = document.createElement('script');
    s.src = src; s.onload = ok; s.onerror = () => ko(new Error(src));
    document.head.appendChild(s);
  });
}
async function libreriaPdf(){
  if (window.jspdf && window.jspdf.jsPDF) return;
  await cargarScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');
  await cargarScript('https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js');
}

/** Cabecera común de los dos informes. */
function encabezado(doc, titulo, subtitulo){
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(18,36,28);
  doc.text('RSHECC Pool Damas \u00ABM\u00E1s que golf\u00BB', 14, 13);
  doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(110,110,98);
  doc.text(titulo + ' \u00B7 Temporada ' + (S.config.temporada_actual||''), 14, 19);
  if (subtitulo) doc.text(subtitulo, 14, 24);
}
function pieInforme(doc){
  const n = doc.internal.getNumberOfPages();
  for (let i = 1; i <= n; i++){
    doc.setPage(i);
    doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(150,150,140);
    const h = doc.internal.pageSize.getHeight(), w = doc.internal.pageSize.getWidth();
    doc.text('Generado el ' + new Date().toLocaleDateString('es-ES'), 14, h - 8);
    doc.text('Web desarrollada por Golfista Curioso', w - 14, h - 8, { align:'right' });
  }
}
const jornadasInforme = () => S.jornadas.filter(j => j.estado !== 'suspendida');

async function pdfGeneral(){
  try { aviso('Preparando el PDF\u2026'); await libreriaPdf(); }
  catch(e){ return aviso('No se pudo cargar el generador de PDF', 'err'); }
  const N = parseInt(S.config.mejores_jornadas || '10', 10);
  const js = jornadasInforme(), g = general();
  const doc = new window.jspdf.jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
  encabezado(doc, 'Clasificaci\u00F3n general',
    'Suma de las ' + N + ' mejores jornadas. En rojo, las tarjetas que puntúan.');

  const head = [
    ['', ...js.map(j => j.recorrido ? j.recorrido[0] : ''), '', ''],
    ['Jugadora', ...js.map(j => fechaCorta(j.fecha)), 'Total', 'Hcp']
  ];
  const body = g.map(p => [
    corto(p),
    ...js.map(j => { const r = p.res.find(x => x.jornada === j.id); return r ? String(r.puntos) : ''; }),
    String(p.total), Number(p.hcp_exacto).toFixed(1)
  ]);

  doc.autoTable({
    head, body, startY: 28, theme:'grid',
    styles:{ font:'helvetica', fontSize:6.2, cellPadding:1, halign:'center',
             lineColor:[216,214,202], lineWidth:0.1, textColor:[18,36,28] },
    headStyles:{ fillColor:[18,36,28], textColor:[255,255,255], fontSize:5.8, fontStyle:'bold' },
    alternateRowStyles:{ fillColor:[247,246,240] },
    columnStyles:{ 0:{ halign:'left', cellWidth:26, fontStyle:'bold' } },
    didParseCell: d => {
      if (d.section !== 'body') return;
      const i = d.column.index;
      if (i === 0) return;
      if (i === js.length + 1){ d.cell.styles.fontStyle = 'bold'; d.cell.styles.fillColor = [237,236,228]; return; }
      if (i === js.length + 2){ d.cell.styles.textColor = [110,110,98]; return; }
      const jug = g[d.row.index], j = js[i-1];
      if (jug && j && jug.cuentan.has(j.id)){
        d.cell.styles.textColor = [190,58,43]; d.cell.styles.fontStyle = 'bold';
      } else if (!d.cell.text[0]){
        d.cell.styles.fillColor = [250,250,247];
      }
    }
  });
  pieInforme(doc);
  doc.save('general-pool-mas-que-golf.pdf');
  aviso('PDF descargado');
}

        <div class="grid2" style="align-items:end;gap:8px;margin-top:8px">
          <div><label class="field">Licencia RFEG</label>
            <input class="mono" value="${esc(p.licencia||'')}" placeholder="—"
                   onchange="editarJugadora('${esc(p.id)}','licencia',this.value)"></div>
          <div><label class="field">Correo</label>
            <input type="email" value="${esc(p.email||'')}" placeholder="—"
                   onchange="editarJugadora('${esc(p.id)}','email',this.value)"></div>
        </div>
      </div>`).join('')}</div>
    <hr class="rule">
    <div class="grid3" style="align-items:end">
      <div style="grid-column:span 2"><label class="field">Nueva jugadora</label><input id="nvNombre" placeholder="Nombre y apellido"></div>
      <div><label class="field">Hcp inicial</label><input id="nvHcp" class="mono" type="number" step="0.1" max="${HCP_MAX}" value="${HCP_MAX.toFixed(1)}"></div>
    </div>
    <button class="btn wide sm" style="margin-top:10px" onclick="altaJugadora()">Dar de alta</button>
    <p class="small muted" style="margin-top:10px">El hándicap inicial que acordéis en septiembre se carga aquí.
      Después el portal lo mantiene solo.</p>
  </div></details>

  <details class="acc"><summary>Calendario <span class="mono muted">${S.jornadas.length} jornadas</span></summary><div>
    <div class="grid3" style="align-items:end">
      <div><label class="field">Primer lunes</label><input id="genDesde" type="date"></div>
      <div><label class="field">Nº jornadas</label><input id="genNum" class="mono" type="number" value="30" min="1" max="60"></div>
      <div><label class="field">Temporada</label><input id="genTemp" value="${esc(S.config.temporada_actual||'2026-27')}"></div>
    </div>
    <button class="btn wide sm ghost" style="margin-top:10px" onclick="generarCalendario()">Generar jornadas semanales</button>
    <hr class="rule">
    <div class="stack">${S.jornadas.map(x=>`
      <div class="row" style="gap:8px;flex-wrap:wrap;border:1px solid var(--line-soft);border-radius:12px;padding:10px">
        <div class="mono" style="font-weight:600;min-width:36px">${esc(x.id)}</div>
        <input type="date" style="flex:1;min-width:150px" value="${esc(x.fecha)}"
               onchange="editarJornada('${esc(x.id)}','fecha',this.value)">
        <select style="flex:1;min-width:120px" onchange="editarJornada('${esc(x.id)}','recorrido',this.value)">
          <option value="" ${!x.recorrido?'selected':''}>Sin fijar</option>
          <option value="Norte" ${x.recorrido==='Norte'?'selected':''}>Norte</option>
          <option value="Sur" ${x.recorrido==='Sur'?'selected':''}>Sur</option>
        </select>
        <select style="flex:1;min-width:130px" onchange="editarJornada('${esc(x.id)}','estado',this.value)">
          <option value="abierta" ${x.estado==='abierta'?'selected':''}>Inscripción abierta</option>
          <option value="cerrada" ${x.estado==='cerrada'?'selected':''}>Cerrada</option>
          <option value="suspendida" ${x.estado==='suspendida'?'selected':''}>Suspendida (festivo)</option>
          <option value="procesada" ${x.estado==='procesada'?'selected':''}>Procesada</option>
        </select>
        <button class="btn ghost sm" onclick="borrarJornada('${esc(x.id)}')" aria-label="Eliminar ${esc(x.id)}">Quitar</button>
      </div>`).join('')}</div>
  </div></details>

  <details class="acc"><summary>Ajustes</summary><div>
    <div class="grid2">
      <div><label class="field">Mejores jornadas que puntúan</label>
        <input class="mono" type="number" min="1" max="40" value="${esc(S.config.mejores_jornadas||'10')}"
               onchange="editarConfig('mejores_jornadas',this.value)"></div>
      <div><label class="field">Hora de cierre del viernes</label>
        <input value="${esc(S.config.cierre_hora||'20:00')}" onchange="editarConfig('cierre_hora',this.value)"></div>
    </div>
    <button class="btn ghost wide sm" style="margin-top:12px" onclick="cambiarClave()">Cambiar la clave de administración</button>
    <button class="btn ghost wide sm" style="margin-top:8px" onclick="S.admin=false;S.vista='jornada';render()">Salir de administración</button>
  </div></details>`;

  const selT = document.getElementById('selJT');
  if (selT) selT.onchange = e => { S.jTarj = e.target.value; render(); };
  const sel = document.getElementById('selJA');
  sel.onchange = () => previaHandicaps(sel.value);
  previaHandicaps(sel.value);
}

async function suspenderJornada(id){
  const j = S.jornadas.find(x => x.id === id);
  if (!confirm(`¿Suspender la jornada ${id} del ${fechaLarga(j.fecha)}?\n\nDesaparecerá de las inscripciones.`)) return;
  const motivo = prompt('Motivo (opcional)', 'Festivo en Madrid');
  const { error } = await db.from('jornadas').update({ estado:'suspendida', nota:motivo || null }).eq('id', id);
  if (error) return aviso('No se pudo suspender', 'err');
  await db.from('inscripciones').delete().eq('jornada', id);
  await cargar(); S.vista = 'admin'; render(); aviso('Jornada suspendida');
}

function previaHandicaps(jid){
  const cont = document.getElementById('previaHcp');
  const j = S.jornadas.find(x => x.id === jid);
  const cartas = S.tarjetas.filter(t => t.jornada===jid && t.puntos != null);
  const yaHecha = S.historial.some(h => h.jornada === jid);
  const anteriores = S.jornadas.filter(x => x.fecha < j.fecha
    && S.tarjetas.some(t => t.jornada===x.id && t.puntos!=null)
    && !S.historial.some(h => h.jornada===x.id));

  if (!cartas.length){
    cont.innerHTML = `<div class="note">No hay tarjetas con puntos en esta jornada.</div>`; return;
  }
  const filas = cartas.map(t => {
    const p = S.jugadoras.find(x => x.id === t.jugadora);
    const prev = S.historial.find(h => h.jornada===jid && h.jugadora===t.jugadora);
    const antes = prev ? Number(prev.hcp_antes) : Number(p ? p.hcp_exacto : 36);
    const r = revisarHcp(antes, t.puntos);
    return { id:t.jugadora, nombre:nombreDe(t.jugadora), puntos:t.puntos, antes, ...r };
  }).sort((a,b) => a.nombre.localeCompare(b.nombre,'es'));

  cont.innerHTML = `
    ${anteriores.length ? `<div class="warn" style="margin-bottom:12px">Hay jornadas anteriores sin procesar
      (${anteriores.map(a=>esc(a.id)).join(', ')}). Procésalas primero para que los hándicaps salgan bien.</div>` : ''}
    ${yaHecha ? `<div class="note" style="margin-bottom:12px">Esta jornada ya se procesó. Volver a aplicarla parte
      de los hándicaps que había antes, así que puedes corregir tarjetas y repetir sin acumular errores.</div>` : ''}
    <div class="scroller"><table class="sheet">
      <thead><tr><th>Jugadora</th><th class="num">Pts</th><th class="num">Antes</th><th class="num">Var.</th><th class="num">Después</th></tr></thead>
      <tbody>${filas.map(f=>`<tr>
        <td class="name">${esc(f.nombre)}</td>
        <td class="num mono">${f.puntos}</td>
        <td class="num mono muted">${f.antes.toFixed(1)}</td>
        <td class="num mono" style="color:${f.variacion<0?'var(--rojo)':(f.variacion>0?'var(--sage)':'var(--muted)')}">
          ${f.variacion>0?'+':''}${f.variacion.toFixed(1)}</td>
        <td class="num mono" style="font-weight:600">${f.despues.toFixed(1)}</td>
      </tr>`).join('')}</tbody>
    </table></div>
    <button class="btn wide" style="margin-top:12px" onclick='aplicarHandicaps(${JSON.stringify(jid)})'>
      ${yaHecha ? 'Volver a aplicar' : 'Aplicar la revisión'}</button>`;
}

async function aplicarHandicaps(jid){
  const j = S.jornadas.find(x => x.id === jid);
  const cartas = S.tarjetas.filter(t => t.jornada===jid && t.puntos != null);
  const filas = [];
  for (const t of cartas){
    const p = S.jugadoras.find(x => x.id === t.jugadora);
    if (!p) continue;
    const prev = S.historial.find(h => h.jornada===jid && h.jugadora===t.jugadora);
    const antes = prev ? Number(prev.hcp_antes) : Number(p.hcp_exacto);
    const r = revisarHcp(antes, t.puntos);
    filas.push({ jornada:jid, jugadora:t.jugadora, puntos:t.puntos, categoria:r.categoria,
      zona_neutra:r.zn, hcp_antes:antes, hcp_despues:r.despues, variacion:r.variacion });
  }
  if (!filas.length) return aviso('Nada que aplicar', 'err');

  const { error } = await db.from('handicaps_historial').upsert(filas, { onConflict:'jornada,jugadora' });
  if (error) return aviso('No se pudo guardar el historial', 'err');
  for (const f of filas){
    const { error:e2 } = await db.from('jugadoras').update({ hcp_exacto:f.hcp_despues }).eq('id', f.jugadora);
    if (e2) return aviso('Error actualizando ' + nombreDe(f.jugadora), 'err');
  }
  await db.from('jornadas').update({ estado:'procesada' }).eq('id', jid);
  await db.from('audit_log').insert({ tabla:'handicaps_historial', operacion:'procesar_jornada',
    detalle:{ jornada:jid, jugadoras:filas.length, por:S.yo?S.yo.nombre:'admin' } });
  await cargar(); S.vista='admin'; render();
  aviso('Hándicaps actualizados');
}

async function editarJugadora(id, campo, valor){
  const v = campo === 'hcp_exacto' ? Math.min(HCP_MAX, Math.max(-10, r1(parseFloat(valor)))) : valor;
  const { error } = await db.from('jugadoras').update({ [campo]:v }).eq('id', id);
  if (error) return aviso('No se pudo guardar', 'err');
  const p = S.jugadoras.find(x => x.id === id); if (p) p[campo] = v;
  aviso('Guardado');
}
async function altaJugadora(){
  const nombre = document.getElementById('nvNombre').value.trim();
  const hcp = Math.min(HCP_MAX, r1(parseFloat(document.getElementById('nvHcp').value)));
  if (!nombre) return aviso('Falta el nombre', 'err');
  const id = nombre.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,40);
  const { error } = await db.from('jugadoras').insert({
    id, nombre, hcp_inicial:hcp, hcp_exacto:hcp, orden:S.jugadoras.length });
  if (error) return aviso('Ya existe una jugadora con ese nombre', 'err');
  await cargar(); render(); aviso('Jugadora dada de alta');
}
async function editarJornada(id, campo, valor){
  const v = valor === '' ? null : valor;
  const { error } = await db.from('jornadas').update({ [campo]:v }).eq('id', id);
  if (error) return aviso('No se pudo guardar', 'err');
  const j = S.jornadas.find(x => x.id === id); if (j) j[campo] = v;
  aviso('Guardado');
}
async function borrarJornada(id){
  const insc = S.inscripciones.filter(i => i.jornada === id).length;
  const tarj = S.tarjetas.filter(t => t.jornada === id).length;
  const extra = (insc || tarj) ? `\n\nSe borrarán también ${insc} inscripciones y ${tarj} tarjetas.` : '';
  if (!confirm(`¿Quitar la jornada ${id} del calendario?${extra}`)) return;
  const { error } = await db.from('jornadas').delete().eq('id', id);
  if (error) return aviso('No se pudo eliminar', 'err');
  await cargar(); render(); aviso('Jornada eliminada');
}
async function editarConfig(clave, valor){
  const { error } = await db.from('config').update({ valor }).eq('clave', clave);
  if (error) return aviso('No se pudo guardar', 'err');
  S.config[clave] = valor; aviso('Guardado');
}
async function generarCalendario(){
  const desde = document.getElementById('genDesde').value;
  const num = parseInt(document.getElementById('genNum').value, 10);
  const temp = document.getElementById('genTemp').value.trim();
  if (!desde || !num) return aviso('Indica la fecha de inicio y el número de jornadas', 'err');
  if (!confirm(`Se crearán ${num} jornadas semanales desde el ${desde}. ¿Continuar?`)) return;
  const filas = [];
  const d = new Date(desde + 'T12:00:00');
  for (let i = 0; i < num; i++){
    filas.push({ id:'J'+String(i+1).padStart(2,'0'), temporada:temp,
      fecha:d.toISOString().slice(0,10), barras:'Rojas', estado:'abierta' });
    d.setDate(d.getDate() + 7);
  }
  const { error } = await db.from('jornadas').upsert(filas, { onConflict:'id' });
  if (error) return aviso('No se pudo generar el calendario', 'err');
  await cargar(); render(); aviso(num + ' jornadas creadas');
}
async function cambiarClave(){
  const actual = prompt('Clave actual'); if (actual == null) return;
  const nueva = prompt('Clave nueva'); if (!nueva) return;
  const { data, error } = await db.rpc('cambiar_clave_admin', { actual, nueva });
  if (error || !data) return aviso('La clave actual no es correcta', 'err');
  aviso('Clave cambiada');
}
